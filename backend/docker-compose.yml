# Local development: PostgreSQL + API with dummy data.
#   docker compose up --build
# The api service applies pending migrations and seeds on start; data you add survives restarts.
# Start over from the SQL files: docker compose run --rm api -reset -seed -no-serve
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthbuddy
      POSTGRES_USER: healthbuddy
      POSTGRES_PASSWORD: healthbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthbuddy -d healthbuddy"]
      interval: 2s
      retries: 30

  api:
    build: .
    command: ["-seed"]
    environment:
      DATABASE_URL: postgres://healthbuddy:healthbuddy@db:5432/healthbuddy?sslmode=disable
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
      ALLOW_DRAFT_LABEL_RULES: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
