# Render Blueprint for the Go API in backend/. The Flutter app is not deployed here.
# Step-by-step guide: backend/DEPLOY_RENDER.md
services:
  - type: web
    name: health-buddy-api
    runtime: docker
    rootDir: backend          # only changes under backend/ trigger a deploy; paths below are relative to it
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore         # same region as the Supabase project
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL     # Supabase Session pooler URL (port 5432, sslmode=require); asked for on first setup
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_TTL
        value: 72h
      - key: CORS_ORIGIN
        value: "*"
      # Trial setup: load the DUMMY reference data and 3 test users, and use the label rules that a
      # nutritionist has not approved yet. Set both to "false" before real users join.
      - key: SEED_DUMMY_DATA
        value: "true"
      - key: ALLOW_DRAFT_LABEL_RULES
        value: "true"
